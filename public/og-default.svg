<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Trefoil mark (top-right, decorative) -->
  <g transform="translate(980, 180) scale(1.8)" opacity="0.12">
    <circle cx="32" cy="63" r="24" fill="none" stroke="white" stroke-width="15.5" stroke-dasharray="100.5 50.3" stroke-dashoffset="137.8"/>
    <circle cx="68" cy="63" r="24" fill="none" stroke="white" stroke-width="15.5" stroke-dasharray="100.5 50.3" stroke-dashoffset="38"/>
    <circle cx="50" cy="32" r="24" fill="none" stroke="white" stroke-width="15.5" stroke-dasharray="100.5 50.3" stroke-dashoffset="88"/>
    <circle cx="32" cy="63" r="24" fill="none" stroke="white" stroke-width="15.5" stroke-dasharray="13 138" stroke-dashoffset="49"/>
    <circle cx="50" cy="53" r="11" fill="white"/>
    <circle cx="50" cy="53" r="6" fill="#0f172a"/>
    <circle cx="50" cy="53" r="2.8" fill="white"/>
  </g>

  <!-- Brand -->
  <text x="100" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" fill="white">Expert<tspan fill="#0071E3">Networks</tspan>.net</text>

  <!-- Tagline -->
  <text x="100" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="500" fill="rgba(255,255,255,0.85)">Compare Expert Networks</text>

  <!-- Value props -->
  <text x="100" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="rgba(255,255,255,0.55)">Independent directory of 33+ expert network providers.</text>
  <text x="100" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="rgba(255,255,255,0.55)">Pricing &#x2022; Compliance &#x2022; AI Capabilities &#x2022; Industry News</text>

  <!-- Accent bar -->
  <rect x="100" y="480" width="100" height="4" rx="2" fill="#0071E3"/>

  <!-- Domain badge -->
  <text x="100" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.35)">expertnetworks.net — Free. Open. No sign-ups.</text>
