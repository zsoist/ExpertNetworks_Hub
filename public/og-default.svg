<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Network node decoration -->
  <circle cx="950" cy="150" r="3" fill="rgba(0,113,227,0.3)"/>
  <circle cx="1020" cy="200" r="2.5" fill="rgba(0,113,227,0.25)"/>
  <circle cx="1080" cy="130" r="2" fill="rgba(0,113,227,0.2)"/>
  <circle cx="980" cy="250" r="2" fill="rgba(0,113,227,0.2)"/>
  <circle cx="1050" cy="280" r="2.5" fill="rgba(0,113,227,0.25)"/>
  <line x1="950" y1="150" x2="1020" y2="200" stroke="rgba(0,113,227,0.12)" stroke-width="1"/>
  <line x1="1020" y1="200" x2="1080" y2="130" stroke="rgba(0,113,227,0.12)" stroke-width="1"/>
  <line x1="1020" y1="200" x2="1050" y2="280" stroke="rgba(0,113,227,0.12)" stroke-width="1"/>
  <line x1="950" y1="150" x2="980" y2="250" stroke="rgba(0,113,227,0.12)" stroke-width="1"/>
  <line x1="980" y1="250" x2="1050" y2="280" stroke="rgba(0,113,227,0.12)" stroke-width="1"/>

  <!-- Brand -->
  <text x="100" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" fill="white">Expert<tspan fill="#0071E3">Networks</tspan>.net</text>

  <!-- Tagline -->
  <text x="100" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="500" fill="rgba(255,255,255,0.85)">Compare Expert Networks</text>

  <!-- Value props -->
  <text x="100" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="rgba(255,255,255,0.55)">Independent directory of 33+ expert network providers.</text>
  <text x="100" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="400" fill="rgba(255,255,255,0.55)">Pricing &#x2022; Compliance &#x2022; AI Capabilities &#x2022; Industry News</text>

  <!-- Accent bar -->
  <rect x="100" y="480" width="100" height="4" rx="2" fill="#0071E3"/>

  <!-- Domain badge -->
  <text x="100" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.35)">expertnetworks.net — Free. Open. No sign-ups.</text>
</svg>
