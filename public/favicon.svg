<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Trefoil knot — three interlocking bands with center bullseye -->
  <!-- Band 1 (bottom z): bottom-left lobe -->
  <circle cx="32" cy="63" r="24" fill="none" stroke="white" stroke-width="20"
    stroke-dasharray="100.5 50.3" stroke-dashoffset="137.8"/>
  <circle cx="32" cy="63" r="24" fill="none" stroke="#0f172a" stroke-width="15.5"
    stroke-dasharray="100.5 50.3" stroke-dashoffset="137.8"/>
  <!-- Band 2 (middle z): bottom-right lobe -->
  <circle cx="68" cy="63" r="24" fill="none" stroke="white" stroke-width="20"
    stroke-dasharray="100.5 50.3" stroke-dashoffset="38"/>
  <circle cx="68" cy="63" r="24" fill="none" stroke="#0f172a" stroke-width="15.5"
    stroke-dasharray="100.5 50.3" stroke-dashoffset="38"/>
  <!-- Band 3 (top z): top lobe -->
  <circle cx="50" cy="32" r="24" fill="none" stroke="white" stroke-width="20"
    stroke-dasharray="100.5 50.3" stroke-dashoffset="88"/>
  <circle cx="50" cy="32" r="24" fill="none" stroke="#0f172a" stroke-width="15.5"
    stroke-dasharray="100.5 50.3" stroke-dashoffset="88"/>
  <!-- Weaving: BL over Top at upper-left crossing -->
  <circle cx="32" cy="63" r="24" fill="none" stroke="white" stroke-width="20"
    stroke-dasharray="13 138" stroke-dashoffset="49"/>
  <circle cx="32" cy="63" r="24" fill="none" stroke="#0f172a" stroke-width="15.5"
    stroke-dasharray="13 138" stroke-dashoffset="49"/>
  <!-- Center bullseye -->
  <circle cx="50" cy="53" r="11" fill="#0f172a"/>
  <circle cx="50" cy="53" r="6" fill="white"/>
  <circle cx="50" cy="53" r="2.8" fill="#0f172a"/>
</svg>
