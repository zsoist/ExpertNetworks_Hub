<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#005BB5"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Network node dots -->
  <circle cx="6" cy="6" r="1.2" fill="rgba(255,255,255,0.35)"/>
  <circle cx="26" cy="6" r="1.2" fill="rgba(255,255,255,0.35)"/>
  <circle cx="6" cy="26" r="1.2" fill="rgba(255,255,255,0.35)"/>
  <circle cx="26" cy="26" r="1.2" fill="rgba(255,255,255,0.35)"/>
  <!-- Connecting lines -->
  <line x1="6" y1="6" x2="16" y2="16" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>
  <line x1="26" y1="6" x2="16" y2="16" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>
  <line x1="6" y1="26" x2="16" y2="16" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>
  <line x1="26" y1="26" x2="16" y2="16" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>
  <!-- EN monogram -->
  <text x="16" y="18" text-anchor="middle" dominant-baseline="central" fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="-0.5">EN</text>
</svg>
