<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" fill="none">
  <defs>
    <!-- Radial glow at network center -->
    <radialGradient id="centerGlow" cx="700" cy="394" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a90d9" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#2a5a8a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <!-- Light sweep -->
    <linearGradient id="lightSweep" x1="500" y1="200" x2="900" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.03"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Document page fill -->
    <linearGradient id="docFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d0d5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a0a0a5" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Glass panel fill -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.03"/>
    </linearGradient>
    <!-- Node glow -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft shadow for documents -->
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="788" fill="#0a0a0c"/>

  <!-- Ambient radial glow -->
  <rect width="1400" height="788" fill="url(#centerGlow)"/>
  <rect width="1400" height="788" fill="url(#lightSweep)"/>

  <!-- ═══ LEFT SIDE: Scattered documents ═══ -->
  <g filter="url(#docShadow)">
    <!-- Document 1 - tilted, upper left -->
    <g transform="translate(140, 180) rotate(-25)">
      <rect width="65" height="82" rx="3" fill="#c8c8cd" opacity="0.55"/>
      <line x1="10" y1="15" x2="55" y2="15" stroke="#8a8a90" stroke-width="1.5" opacity="0.4"/>
      <line x1="10" y1="23" x2="48" y2="23" stroke="#8a8a90" stroke-width="1" opacity="0.3"/>
      <line x1="10" y1="30" x2="52" y2="30" stroke="#8a8a90" stroke-width="1" opacity="0.3"/>
      <line x1="10" y1="37" x2="40" y2="37" stroke="#8a8a90" stroke-width="1" opacity="0.25"/>
      <rect x="10" y="48" width="25" height="18" rx="2" fill="#7a7a82" opacity="0.25"/>
    </g>

    <!-- Document 2 - more tilted, floating -->
    <g transform="translate(80, 300) rotate(-35)">
      <rect width="58" height="74" rx="3" fill="#b8b8be" opacity="0.45"/>
      <line x1="8" y1="12" x2="48" y2="12" stroke="#8a8a90" stroke-width="1.5" opacity="0.35"/>
      <line x1="8" y1="19" x2="42" y2="19" stroke="#8a8a90" stroke-width="1" opacity="0.25"/>
      <line x1="8" y1="25" x2="45" y2="25" stroke="#8a8a90" stroke-width="1" opacity="0.25"/>
      <circle cx="30" cy="48" r="10" fill="#7a7a82" opacity="0.2"/>
    </g>

    <!-- Document 3 - slightly tilted -->
    <g transform="translate(200, 130) rotate(-12)">
      <rect width="70" height="88" rx="3" fill="#d0d0d5" opacity="0.5"/>
      <line x1="10" y1="14" x2="60" y2="14" stroke="#8a8a90" stroke-width="1.5" opacity="0.4"/>
      <line x1="10" y1="22" x2="55" y2="22" stroke="#8a8a90" stroke-width="1" opacity="0.3"/>
      <line x1="10" y1="29" x2="50" y2="29" stroke="#8a8a90" stroke-width="1" opacity="0.3"/>
      <!-- Mini bar chart -->
      <rect x="10" y="42" width="8" height="28" rx="1" fill="#7a7a82" opacity="0.2"/>
      <rect x="22" y="50" width="8" height="20" rx="1" fill="#7a7a82" opacity="0.2"/>
      <rect x="34" y="38" width="8" height="32" rx="1" fill="#7a7a82" opacity="0.2"/>
    </g>

    <!-- Document 4 - lower, falling -->
    <g transform="translate(120, 430) rotate(-42)">
      <rect width="55" height="70" rx="3" fill="#b0b0b6" opacity="0.4"/>
      <line x1="8" y1="12" x2="45" y2="12" stroke="#8a8a90" stroke-width="1.5" opacity="0.3"/>
      <line x1="8" y1="19" x2="40" y2="19" stroke="#8a8a90" stroke-width="1" opacity="0.25"/>
      <line x1="8" y1="25" x2="42" y2="25" stroke="#8a8a90" stroke-width="1" opacity="0.25"/>
    </g>

    <!-- Document 5 - far left, very tilted -->
    <g transform="translate(50, 220) rotate(-50)">
      <rect width="50" height="64" rx="3" fill="#a8a8ae" opacity="0.35"/>
      <line x1="8" y1="12" x2="40" y2="12" stroke="#8a8a90" stroke-width="1" opacity="0.25"/>
      <line x1="8" y1="18" x2="35" y2="18" stroke="#8a8a90" stroke-width="1" opacity="0.2"/>
    </g>

    <!-- Document 6 - small, tumbling -->
    <g transform="translate(230, 360) rotate(-18)">
      <rect width="50" height="62" rx="3" fill="#c0c0c6" opacity="0.42"/>
      <line x1="8" y1="10" x2="40" y2="10" stroke="#8a8a90" stroke-width="1" opacity="0.3"/>
      <line x1="8" y1="16" x2="35" y2="16" stroke="#8a8a90" stroke-width="1" opacity="0.25"/>
      <rect x="8" y="24" width="34" height="22" rx="2" fill="#7a7a82" opacity="0.15"/>
    </g>

    <!-- Document 7 - bottom area -->
    <g transform="translate(170, 510) rotate(-30)">
      <rect width="60" height="75" rx="3" fill="#b5b5bb" opacity="0.38"/>
      <line x1="9" y1="13" x2="50" y2="13" stroke="#8a8a90" stroke-width="1.5" opacity="0.3"/>
      <line x1="9" y1="20" x2="45" y2="20" stroke="#8a8a90" stroke-width="1" opacity="0.25"/>
    </g>

    <!-- Document 8 - small, upper -->
    <g transform="translate(280, 230) rotate(-8)">
      <rect width="48" height="60" rx="3" fill="#c5c5cb" opacity="0.4"/>
      <line x1="7" y1="10" x2="38" y2="10" stroke="#8a8a90" stroke-width="1" opacity="0.3"/>
      <line x1="7" y1="16" x2="35" y2="16" stroke="#8a8a90" stroke-width="1" opacity="0.25"/>
      <line x1="7" y1="22" x2="30" y2="22" stroke="#8a8a90" stroke-width="1" opacity="0.2"/>
    </g>
  </g>

  <!-- ═══ CENTER: Network mesh / transition zone ═══ -->
  <!-- Connection lines forming the network -->
  <g opacity="0.6">
    <!-- Primary network lines -->
    <line x1="380" y1="250" x2="500" y2="300" stroke="#3a7abd" stroke-width="0.6" opacity="0.35"/>
    <line x1="350" y1="380" x2="500" y2="340" stroke="#3a7abd" stroke-width="0.6" opacity="0.3"/>
    <line x1="380" y1="450" x2="520" y2="400" stroke="#3a7abd" stroke-width="0.5" opacity="0.25"/>
    <line x1="420" y1="180" x2="540" y2="260" stroke="#3a7abd" stroke-width="0.5" opacity="0.3"/>

    <!-- Core network mesh -->
    <line x1="500" y1="300" x2="600" y2="250" stroke="#4a90d9" stroke-width="0.8" opacity="0.4"/>
    <line x1="500" y1="300" x2="600" y2="350" stroke="#4a90d9" stroke-width="0.8" opacity="0.4"/>
    <line x1="500" y1="300" x2="600" y2="450" stroke="#4a90d9" stroke-width="0.6" opacity="0.3"/>
    <line x1="500" y1="340" x2="600" y2="350" stroke="#4a90d9" stroke-width="0.7" opacity="0.35"/>
    <line x1="540" y1="260" x2="600" y2="250" stroke="#4a90d9" stroke-width="0.7" opacity="0.4"/>
    <line x1="520" y1="400" x2="600" y2="450" stroke="#4a90d9" stroke-width="0.6" opacity="0.3"/>
    <line x1="500" y1="300" x2="540" y2="260" stroke="#4a90d9" stroke-width="0.7" opacity="0.35"/>
    <line x1="500" y1="340" x2="520" y2="400" stroke="#4a90d9" stroke-width="0.6" opacity="0.3"/>
    <line x1="540" y1="260" x2="500" y2="340" stroke="#4a90d9" stroke-width="0.5" opacity="0.2"/>

    <!-- Extended network to right -->
    <line x1="600" y1="250" x2="700" y2="200" stroke="#4a90d9" stroke-width="0.8" opacity="0.45"/>
    <line x1="600" y1="250" x2="700" y2="300" stroke="#4a90d9" stroke-width="0.8" opacity="0.45"/>
    <line x1="600" y1="350" x2="700" y2="300" stroke="#4a90d9" stroke-width="0.8" opacity="0.45"/>
    <line x1="600" y1="350" x2="700" y2="400" stroke="#4a90d9" stroke-width="0.8" opacity="0.4"/>
    <line x1="600" y1="450" x2="700" y2="400" stroke="#4a90d9" stroke-width="0.7" opacity="0.35"/>
    <line x1="600" y1="450" x2="700" y2="500" stroke="#4a90d9" stroke-width="0.6" opacity="0.3"/>
    <line x1="600" y1="250" x2="600" y2="350" stroke="#4a90d9" stroke-width="0.5" opacity="0.2"/>
    <line x1="600" y1="350" x2="600" y2="450" stroke="#4a90d9" stroke-width="0.5" opacity="0.2"/>
    <line x1="700" y1="200" x2="700" y2="300" stroke="#4a90d9" stroke-width="0.5" opacity="0.25"/>
    <line x1="700" y1="300" x2="700" y2="400" stroke="#4a90d9" stroke-width="0.5" opacity="0.25"/>
    <line x1="700" y1="400" x2="700" y2="500" stroke="#4a90d9" stroke-width="0.5" opacity="0.2"/>

    <!-- Far right structured grid lines -->
    <line x1="700" y1="200" x2="800" y2="200" stroke="#4a90d9" stroke-width="0.9" opacity="0.5"/>
    <line x1="700" y1="300" x2="800" y2="300" stroke="#4a90d9" stroke-width="0.9" opacity="0.5"/>
    <line x1="700" y1="400" x2="800" y2="400" stroke="#4a90d9" stroke-width="0.9" opacity="0.5"/>
    <line x1="700" y1="500" x2="800" y2="500" stroke="#4a90d9" stroke-width="0.7" opacity="0.4"/>
    <line x1="800" y1="200" x2="900" y2="200" stroke="#4a90d9" stroke-width="0.9" opacity="0.5"/>
    <line x1="800" y1="300" x2="900" y2="300" stroke="#4a90d9" stroke-width="0.9" opacity="0.5"/>
    <line x1="800" y1="400" x2="900" y2="400" stroke="#4a90d9" stroke-width="0.9" opacity="0.5"/>
    <line x1="800" y1="500" x2="900" y2="500" stroke="#4a90d9" stroke-width="0.7" opacity="0.4"/>
    <line x1="900" y1="200" x2="1000" y2="200" stroke="#4a90d9" stroke-width="0.8" opacity="0.45"/>
    <line x1="900" y1="300" x2="1000" y2="300" stroke="#4a90d9" stroke-width="0.8" opacity="0.45"/>
    <line x1="900" y1="400" x2="1000" y2="400" stroke="#4a90d9" stroke-width="0.8" opacity="0.45"/>
    <!-- Vertical grid -->
    <line x1="800" y1="200" x2="800" y2="500" stroke="#4a90d9" stroke-width="0.6" opacity="0.3"/>
    <line x1="900" y1="200" x2="900" y2="500" stroke="#4a90d9" stroke-width="0.6" opacity="0.3"/>
    <line x1="1000" y1="200" x2="1000" y2="400" stroke="#4a90d9" stroke-width="0.5" opacity="0.25"/>
    <!-- Diagonal connections -->
    <line x1="700" y1="200" x2="800" y2="300" stroke="#4a90d9" stroke-width="0.4" opacity="0.15"/>
    <line x1="800" y1="200" x2="900" y2="300" stroke="#4a90d9" stroke-width="0.4" opacity="0.15"/>
    <line x1="700" y1="300" x2="800" y2="400" stroke="#4a90d9" stroke-width="0.4" opacity="0.15"/>
    <line x1="800" y1="300" x2="900" y2="400" stroke="#4a90d9" stroke-width="0.4" opacity="0.15"/>
    <!-- Outer edge connections -->
    <line x1="1000" y1="200" x2="1080" y2="280" stroke="#4a90d9" stroke-width="0.5" opacity="0.3"/>
    <line x1="1000" y1="400" x2="1080" y2="350" stroke="#4a90d9" stroke-width="0.5" opacity="0.25"/>
    <line x1="700" y1="200" x2="650" y2="150" stroke="#4a90d9" stroke-width="0.4" opacity="0.2"/>
  </g>

  <!-- Network nodes -->
  <g filter="url(#nodeGlow)">
    <!-- Core transition nodes -->
    <circle cx="500" cy="300" r="3.5" fill="#5ba4e6" opacity="0.7"/>
    <circle cx="500" cy="340" r="3" fill="#5ba4e6" opacity="0.6"/>
    <circle cx="540" cy="260" r="3" fill="#5ba4e6" opacity="0.6"/>
    <circle cx="520" cy="400" r="2.5" fill="#5ba4e6" opacity="0.5"/>

    <!-- Mid-network nodes -->
    <circle cx="600" cy="250" r="4" fill="#5ba4e6" opacity="0.8"/>
    <circle cx="600" cy="350" r="4" fill="#5ba4e6" opacity="0.8"/>
    <circle cx="600" cy="450" r="3.5" fill="#5ba4e6" opacity="0.65"/>

    <!-- Grid intersection nodes -->
    <circle cx="700" cy="200" r="4.5" fill="#6ab0f0" opacity="0.85"/>
    <circle cx="700" cy="300" r="4.5" fill="#6ab0f0" opacity="0.85"/>
    <circle cx="700" cy="400" r="4.5" fill="#6ab0f0" opacity="0.8"/>
    <circle cx="700" cy="500" r="3.5" fill="#6ab0f0" opacity="0.65"/>
    <circle cx="800" cy="200" r="4" fill="#6ab0f0" opacity="0.8"/>
    <circle cx="800" cy="300" r="4" fill="#6ab0f0" opacity="0.8"/>
    <circle cx="800" cy="400" r="4" fill="#6ab0f0" opacity="0.75"/>
    <circle cx="800" cy="500" r="3" fill="#6ab0f0" opacity="0.6"/>
    <circle cx="900" cy="200" r="3.5" fill="#6ab0f0" opacity="0.75"/>
    <circle cx="900" cy="300" r="3.5" fill="#6ab0f0" opacity="0.75"/>
    <circle cx="900" cy="400" r="3.5" fill="#6ab0f0" opacity="0.7"/>
    <circle cx="900" cy="500" r="2.5" fill="#6ab0f0" opacity="0.5"/>
    <circle cx="1000" cy="200" r="3" fill="#6ab0f0" opacity="0.65"/>
    <circle cx="1000" cy="300" r="3" fill="#6ab0f0" opacity="0.65"/>
    <circle cx="1000" cy="400" r="3" fill="#6ab0f0" opacity="0.6"/>

    <!-- Edge node -->
    <circle cx="1080" cy="280" r="3" fill="#5ba4e6" opacity="0.55"/>
    <circle cx="1080" cy="350" r="2.5" fill="#5ba4e6" opacity="0.45"/>
  </g>

  <!-- ═══ RIGHT SIDE: Structured glass panels (dashboards) ═══ -->
  <!-- Panel 1: Chart panel (top right) -->
  <g transform="translate(830, 120)" opacity="0.5">
    <rect width="180" height="120" rx="8" fill="url(#glassFill)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <!-- Chart line -->
    <polyline points="20,85 50,60 80,70 110,35 140,45 160,25" fill="none" stroke="#5ba4e6" stroke-width="1.2" opacity="0.6"/>
    <line x1="20" y1="95" x2="160" y2="95" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  </g>

  <!-- Panel 2: Flow diagram (top center-right) -->
  <g transform="translate(660, 100)" opacity="0.4">
    <rect width="150" height="90" rx="8" fill="url(#glassFill)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <!-- Flow boxes -->
    <rect x="15" y="20" width="30" height="16" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="0.4"/>
    <rect x="60" y="20" width="30" height="16" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="0.4"/>
    <rect x="105" y="20" width="30" height="16" rx="3" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="0.4"/>
    <line x1="45" y1="28" x2="60" y2="28" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
    <line x1="90" y1="28" x2="105" y2="28" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
    <rect x="15" y="50" width="30" height="16" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="0.4"/>
    <rect x="60" y="50" width="30" height="16" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="0.4"/>
  </g>

  <!-- Panel 3: Data table (right center) -->
  <g transform="translate(920, 310)" opacity="0.45">
    <rect width="170" height="110" rx="8" fill="url(#glassFill)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <!-- Table rows -->
    <line x1="15" y1="30" x2="155" y2="30" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <line x1="15" y1="50" x2="155" y2="50" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <line x1="15" y1="70" x2="155" y2="70" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <line x1="15" y1="90" x2="155" y2="90" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <!-- Labels -->
    <rect x="15" y="15" width="40" height="6" rx="2" fill="rgba(255,255,255,0.1)"/>
    <rect x="70" y="15" width="30" height="6" rx="2" fill="rgba(255,255,255,0.08)"/>
    <rect x="115" y="15" width="35" height="6" rx="2" fill="rgba(255,255,255,0.08)"/>
    <!-- Cells -->
    <rect x="15" y="37" width="35" height="5" rx="1.5" fill="rgba(255,255,255,0.06)"/>
    <rect x="70" y="37" width="25" height="5" rx="1.5" fill="rgba(255,255,255,0.05)"/>
    <rect x="15" y="57" width="40" height="5" rx="1.5" fill="rgba(255,255,255,0.06)"/>
    <rect x="70" y="57" width="28" height="5" rx="1.5" fill="rgba(255,255,255,0.05)"/>
    <rect x="15" y="77" width="32" height="5" rx="1.5" fill="rgba(255,255,255,0.06)"/>
  </g>

  <!-- Panel 4: Wave chart (bottom right) -->
  <g transform="translate(860, 470)" opacity="0.4">
    <rect width="160" height="90" rx="8" fill="url(#glassFill)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <!-- Sine wave -->
    <path d="M 15 55 Q 40 30, 60 50 Q 80 70, 100 45 Q 120 20, 145 50" fill="none" stroke="#5ba4e6" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Subtle light flare at center -->
  <circle cx="650" cy="320" r="120" fill="radial-gradient" opacity="0.03">
  </circle>
  <ellipse cx="650" cy="320" rx="80" ry="60" fill="white" opacity="0.015"/>

  <!-- Corner sparkle (matching original) -->
  <g transform="translate(1340, 740)" opacity="0.4">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="white" opacity="0.6"/>
  </g>
</svg>